[package]
name = "devcli-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
chrono.workspace = true
dirs = "5.0"
futures = "0.3"
colored = "2.1"
inquire = "0.7"
# unstable-rendered-line-info enables Paragraph::line_count (exact wrapped-row
# count, used by the log viewer scroll clamp). Pinned by Cargo.lock; ratatui has
# more options in 0.30-beta where line_count is still unstable.
ratatui = { version = "0.30.0-beta.0", features = ["unstable-rendered-line-info"] }
ratatui-widgets = "0.3.0-beta.0"
crossterm = "0.27"
syntect = "5.1"
base64 = "0.22.1"
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls", "json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-appender = "0.2"
process-manager = { path = "../process-manager" }
env-flow = { path = "../env-flow" }
app-detector = { path = "../app-detector" }
config-manager = { path = "../config-manager" }
shell-words = "1.1"

[dev-dependencies]
tokio-test = "0.4"
tempfile = "3.8"
