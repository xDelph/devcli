name: Release Please

on:
  # Release Please must never open a release PR from a red build. This repository
  # is private and has no branch protection (GitHub Pro feature), so we cannot
  # require a status check the usual way: instead we wait for the CI workflow to
  # finish and only run when it succeeded.
  workflow_run:
    workflows: ["CI"]
    branches: [develop]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    # `workflow_dispatch` has no workflow_run payload, hence the disjunction.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Token with permission to trigger downstream workflows (default GITHUB_TOKEN cannot)
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

          # workflow_run payloads do not carry the triggering ref
          target-branch: develop

          # The workspace root is a virtual manifest and every crate inherits
          # `version.workspace = true`, so release-please is configured in
          # release-please-config.json with release-type "simple" and bumps
          # Cargo.toml [workspace.package].version directly. The "rust" release
          # type would instead expand the workspace and demand a per-crate tag.

          # Changelog sections
          changelog-types: |
            [
              {"type":"feat","section":"Features","hidden":false},
              {"type":"fix","section":"Bug Fixes","hidden":false},
              {"type":"perf","section":"Performance","hidden":false},
              {"type":"deps","section":"Dependencies","hidden":false},
              {"type":"revert","section":"Reverts","hidden":false},
              {"type":"docs","section":"Documentation","hidden":false},
              {"type":"style","section":"Styles","hidden":true},
              {"type":"chore","section":"Miscellaneous","hidden":true},
              {"type":"refactor","section":"Code Refactoring","hidden":false},
              {"type":"test","section":"Tests","hidden":true},
              {"type":"build","section":"Build System","hidden":true},
              {"type":"ci","section":"CI/CD","hidden":true}
            ]

      # release-please bumps [workspace.package].version in Cargo.toml but has no
      # updater for Cargo.lock under the "simple" release type, so the lockfile
      # kept the previous version of every workspace crate. Re-resolve the
      # workspace members on the release PR branch and push the result, so the
      # merged release builds with `--locked`.
      - name: Check out the release PR branch
        if: steps.release.outputs.pr
        uses: actions/checkout@v4
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Install Rust toolchain
        if: steps.release.outputs.pr
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Sync Cargo.lock with the bumped workspace version
        if: steps.release.outputs.pr
        run: |
          cargo update --workspace
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in step"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): sync Cargo.lock" -- Cargo.lock
          git push

      # Output the release information.
      # The `pr` output is raw JSON whose changelog body contains parentheses
      # ("*beep* (boop)"), which the shell tried to parse — that alone turned every
      # successful release run red. Only the title is echoed, and the whole payload
      # is passed through stdin so nothing is ever word-split.
      - name: Show release info
        if: steps.release.outputs.release_created
        env:
          PR_JSON: ${{ steps.release.outputs.pr }}
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "🎉 Release created!"
          echo "Tag: $TAG_NAME"
          echo "Version: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}"
          echo "Release PR title: $(printf '%s' "$PR_JSON" | jq -r '.title // "n/a"')"
