name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always
  RUNNER_OS: ubuntu-latest

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ci-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ci-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ci-cargo-lint-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ci-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ci-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ci-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release --workspace

      - name: Check binary exists
        run: test -f target/release/devcli

  test:
    name: Test
    runs-on: ubuntu-latest
    # Surface a stuck test with its log instead of burning the 6h default budget.
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ci-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ci-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ci-cargo-test-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-cargo-build-target-

      - name: Run tests (app-detector)
        run: cargo test -p app-detector --all-features

      - name: Run tests (config-manager)
        run: cargo test -p config-manager --all-features

      - name: Run tests (env-flow)
        run: cargo test -p env-flow --all-features

      - name: Run tests (devcli-core)
        run: cargo test -p devcli-core --all-features

      - name: Run tests (devcli)
        run: cargo test -p devcli --all-features

      - name: Run doc tests
        run: cargo test --workspace --doc

  process-tests:
    name: Process tests
    runs-on: ubuntu-latest
    # These tests spawn and kill real OS processes. They pass on macOS and on
    # Ubuntu 24.04 with the pinned toolchain, but the GitHub runner has repeatedly
    # wedged the step containing them: it never returns, survives SIGTERM and
    # SIGKILL, and GitHub then uploads no log. A short job timeout turns that
    # into a visible failure instead of an indefinitely pending check.
    timeout-minutes: 10
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ci-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-cargo-registry-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ci-cargo-proctest-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ci-cargo-proctest-target-

      - name: Run process-manager tests
        run: cargo test -p process-manager --all-features
