name: probe-secret
on: workflow_dispatch
permissions:
  contents: write
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test PAT
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          echo "token prefix: ${RELEASE_PLEASE_TOKEN:0:4}"
          gh api user --jq '"authed as: \(.login)"' 2>&1 | head -2
          gh api repos/xDelph/devcli --jq '"repo perms: push=\(.permissions.push) admin=\(.permissions.admin)"' 2>&1 | head -2
          echo "--- tentative create release (draft, tag probe-$(date +%s)) ---"
          gh api -X POST repos/xDelph/devcli/releases -f tag_name="probe-$RANDOM" -f name=p -f body=p -F draft=true --jq '.id' 2>&1 | head -3
