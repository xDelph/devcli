name: Release to Public Repo

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always
  # ⚠️ CHANGE THESE to your values
  PUBLIC_REPO_OWNER: xDelph
  PUBLIC_REPO_NAME: devcli

jobs:
  create-release:
    name: Create Release in Public Repo
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION="${{ steps.get_version.outputs.version }}"

          # Get changelog content between this version and next version heading
          CHANGELOG_CONTENT=$(awk "/^## \[$VERSION\]/,/^## \[/" CHANGELOG.md | sed '1d;$d' || echo "")

          # If empty, use a default message
          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="See [CHANGELOG.md](https://github.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/blob/main/CHANGELOG.md) for details."
          fi

          # Save to file for multi-line handling
          echo "$CHANGELOG_CONTENT" > /tmp/changelog_content.txt

      - name: Create release in public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # Read changelog content
          CHANGELOG_CONTENT=$(cat /tmp/changelog_content.txt)

          # Create release with changelog
          gh release create ${{ github.ref_name }} \
            --repo ${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }} \
            --title "Release ${{ github.ref_name }}" \
            --notes "$(cat <<EOF
          ${CHANGELOG_CONTENT}

          ## Installation

          **Recommended**: Install script
          \`\`\`bash
          curl -fsSL https://raw.githubusercontent.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/main/install.sh | sh
          \`\`\`

          **Manual**: Download binary for your platform

          ### macOS (Apple Silicon)
          \`\`\`bash
          curl -L https://github.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/releases/download/${{ github.ref_name }}/devcli-aarch64-apple-darwin.tar.gz | tar xz
          chmod +x devcli && mv devcli ~/.devcli/bin/
          \`\`\`

          ### macOS (Intel)
          \`\`\`bash
          curl -L https://github.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/releases/download/${{ github.ref_name }}/devcli-x86_64-apple-darwin.tar.gz | tar xz
          chmod +x devcli && mv devcli ~/.devcli/bin/
          \`\`\`

          ### Linux (x64)
          \`\`\`bash
          curl -L https://github.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/releases/download/${{ github.ref_name }}/devcli-x86_64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x devcli && mv devcli ~/.devcli/bin/
          \`\`\`

          ### Linux (ARM64)
          \`\`\`bash
          curl -L https://github.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/releases/download/${{ github.ref_name }}/devcli-aarch64-unknown-linux-gnu.tar.gz | tar xz
          chmod +x devcli && mv devcli ~/.devcli/bin/
          \`\`\`

          ### Verify Checksums
          \`\`\`bash
          shasum -a 256 -c devcli-<platform>.tar.gz.sha256
          \`\`\`

          ## Documentation

          - 📖 [Getting Started](https://github.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/blob/main/docs/getting-started.md)
          - 📚 [Full Documentation](https://github.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/tree/main/docs)
          - 📝 [CHANGELOG](https://github.com/${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}/blob/main/CHANGELOG.md)
          EOF
          )"

  build-release:
    name: Build ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Intel
          - os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false

          # macOS Apple Silicon
          - os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Strip binary
        run: strip target/${{ matrix.target }}/release/devcli

      - name: Create archive
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../devcli-${{ matrix.target }}.tar.gz devcli
          cd -

      - name: Generate checksum
        run: |
          shasum -a 256 devcli-${{ matrix.target }}.tar.gz > devcli-${{ matrix.target }}.tar.gz.sha256

      - name: Upload binaries to public repo release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          # Upload both archive and checksum
          gh release upload ${{ github.ref_name }} \
            devcli-${{ matrix.target }}.tar.gz \
            devcli-${{ matrix.target }}.tar.gz.sha256 \
            --repo ${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }} \
            --clobber

      - name: Verify upload
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          echo "✅ Uploaded devcli-${{ matrix.target }}.tar.gz to public repo"
          gh release view ${{ github.ref_name }} \
            --repo ${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }} \
            --json assets \
            --jq '.assets[].name' | grep "${{ matrix.target }}"

  sync-documentation:
    name: Sync Documentation to Public Repo
    needs: create-release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          path: private

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.PUBLIC_REPO_OWNER }}/${{ env.PUBLIC_REPO_NAME }}
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          path: public

      - name: Sync documentation files
        run: |
          echo "📄 Syncing documentation files..."

          # Core files
          cp private/README.md public/README.md
          cp private/LICENSE public/LICENSE
          cp private/LICENSE-COMMERCIAL.md public/LICENSE-COMMERCIAL.md

          # Docs folder (user-facing documentation)
          if [ -d "private/docs" ]; then
            echo "📁 Syncing docs/ folder..."
            rm -rf public/docs
            cp -r private/docs public/docs
          fi

          # CHANGELOG (generated by release-please)
          if [ -f "private/CHANGELOG.md" ]; then
            echo "📝 Syncing CHANGELOG.md..."
            cp private/CHANGELOG.md public/CHANGELOG.md
          fi

          # Install script (once created)
          if [ -f "private/install.sh" ]; then
            echo "🚀 Syncing install.sh..."
            cp private/install.sh public/install.sh
            chmod +x public/install.sh
          fi

          echo "✅ Documentation sync complete"

      - name: Show changes
        run: |
          cd public
          echo "Changes to be committed:"
          git status --short

      - name: Commit and push to public repo
        run: |
          cd public
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add .

          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "ℹ️  No documentation changes to commit"
          else
            git commit -m "docs: sync documentation for release ${{ github.ref_name }}"
            git push
            echo "✅ Documentation pushed to public repo"
          fi
