[package]
name = "config-manager"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Flexible, schema-based configuration management with validation and dependency resolution"

[dependencies]
# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
toml = { version = "0.8", optional = true }
serde_yaml = { version = "0.9", optional = true }

# Error handling
anyhow = { workspace = true }
thiserror = "1.0"

# Utilities
once_cell = "1.19"

[dev-dependencies]
tempfile = "3.8"
proptest = "1.4"
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []

# Format support (JSON is always available)
toml = ["dep:toml"]
yaml = ["dep:serde_yaml"]
all-formats = ["toml", "yaml"]

# Full feature set
full = ["all-formats"]

[lib]
name = "config_manager"
path = "src/lib.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "hierarchical"
path = "examples/hierarchical.rs"

[[example]]
name = "dependencies"
path = "examples/dependencies.rs"

[[bench]]
name = "loader_benchmarks"
harness = false

[[bench]]
name = "dependency_benchmarks"
harness = false

[[bench]]
name = "resolver_benchmarks"
harness = false
