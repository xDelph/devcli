[workspace]
members = ["app-detector", "config-manager", "devcli", "devcli-core", "env-flow", "process-manager"]
resolver = "2"

[workspace.package]
version = "0.7.0"
edition = "2021"
authors = ["Thomas Delalonde"]
license = "PolyForm-Noncommercial-1.0.0"
repository = "https://github.com/xDelph/devcli"
homepage = "https://github.com/xDelph/devcli"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
