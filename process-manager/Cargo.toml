[package]
name = "process-manager"
version.workspace = true
edition = "2021"
description = "Process lifecycle manager: spawning, state tracking, health checks, and the pm-daemon supervisor"
license.workspace = true
repository.workspace = true

[dependencies]
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
libc = { workspace = true }
tracing = "0.1"
reqwest = { version = "0.11", features = ["json", "blocking"] }
dirs = "5.0"
filetime = "0.2"
uuid = { version = "1.7", features = ["v4", "serde"] }
fs2 = "0.4.3"
shell-words = "1.1"

[[bin]]
name = "pm-daemon"
path = "src/bin/pm-daemon.rs"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"
fs2 = "0.4.3"
