[package]
name = "app-detector"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A strategy-based detection platform for automatically discovering application types, frameworks, and deployment environments"
keywords = ["detection", "framework", "language", "devtools"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
once_cell = "1.19"
tracing = "0.1"

[dev-dependencies]
tempfile = "3.8"
tokio-test = "0.4"

[features]
default = []
commands = []           # Optional command generation utilities
plugins = ["libloading"]  # Enable plugin loading
full = ["commands", "plugins"]

[dependencies.libloading]
version = "0.8"
optional = true
