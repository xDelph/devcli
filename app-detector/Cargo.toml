[package]
name = "app-detector"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "A strategy-based detection platform for automatically discovering application types, frameworks, and deployment environments"
keywords = ["detection", "framework", "language", "devtools"]
categories = ["development-tools"]

[dependencies]
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
once_cell = "1.19"
tracing = "0.1"
# Only the `app-detector` binary needs these.
clap = { version = "4.5", features = ["derive", "color", "suggestions"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], optional = true }
colored = { version = "2.1", optional = true }

[dev-dependencies]
tempfile = "3.8"

[features]
default = ["cli"]
# The standalone `app-detector` command-line tool. Library users (devcli)
# disable default features and do not compile the CLI dependencies.
cli = ["dep:clap", "dep:colored", "dep:tracing-subscriber"]

[[bin]]
name = "app-detector"
path = "src/main.rs"
required-features = ["cli"]
